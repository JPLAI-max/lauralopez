kind = "web"
previewPath = "/"
title = "Laura Lopez — Beverly Hills Estates"
version = "1.0.0"
id = "artifacts/laura-lopez"
router = "path"

[[integratedSkills]]
name = "react-vite"
version = "1.0.0"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 19969

[services.development]
run = "pnpm --filter @workspace/laura-lopez run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/laura-lopez", "run", "build" ]
publicDir = "artifacts/laura-lopez/dist/public"
serve = "static"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "19969"
BASE_PATH = "/"
